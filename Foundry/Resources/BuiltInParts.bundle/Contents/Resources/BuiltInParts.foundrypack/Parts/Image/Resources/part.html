<figure class="foundry-image-part {{ part.class }}" {{ part.attributes }}>
    {{ if control.destination }}<a class="foundry-part-link" href="{{ control.destination }}" target="{{ control.destination.target }}" {{ control.destination.attributes }} aria-label="{{ control.linkLabel }}"></a>{{ endif }}<img class="fd-image" src="{{ control.source }}" width="{{ control.source.width }}" height="{{ control.source.height }}" style="object-position: {{ control.source.position }}" alt="{{ control.source.alt }}"></figure>

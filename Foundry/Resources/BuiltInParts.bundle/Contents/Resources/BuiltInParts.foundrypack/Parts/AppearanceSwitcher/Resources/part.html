<div class="btn-group {{ control.theme }} {{ control.spacing.classes }} {{ part.class }}" {{ part.attributes }} data-appearance-switcher>
  <button class="btn {{ control.variant }} {{ control.size }}" type="button" data-bs-toggle="menu" aria-expanded="false" aria-label="Colour mode">
    <i class="bi {{ if control.defaultAppearance == 'light' }}bi-sun-fill{{ else }}{{ if control.defaultAppearance == 'dark' }}bi-moon-stars-fill{{ else }}bi-circle-half{{ endif }}{{ endif }}" data-current-icon aria-hidden="true"></i>
    <i class="bi bi-chevron-expand" aria-hidden="true"></i>
  </button>
  <div class="menu">
    <button class="menu-item" type="button" data-mode="light" aria-pressed="false"><i class="bi bi-sun-fill menu-item-icon" aria-hidden="true"></i>Light<i class="bi bi-check2 ms-auto" data-check aria-hidden="true" hidden></i></button>
    <button class="menu-item" type="button" data-mode="dark" aria-pressed="false"><i class="bi bi-moon-stars-fill menu-item-icon" aria-hidden="true"></i>Dark<i class="bi bi-check2 ms-auto" data-check aria-hidden="true" hidden></i></button>
    <button class="menu-item" type="button" data-mode="system" aria-pressed="false"><i class="bi bi-circle-half menu-item-icon" aria-hidden="true"></i>Auto<i class="bi bi-check2 ms-auto" data-check aria-hidden="true" hidden></i></button>
  </div>
</div>

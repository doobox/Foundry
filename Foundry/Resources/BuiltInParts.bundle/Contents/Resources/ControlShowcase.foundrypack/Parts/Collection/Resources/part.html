<section class="foundry-showcase foundry-showcase-collection {{ part.class }}" {{ part.attributes }}>
  <h2>Collection</h2>
  <div class="foundry-showcase-collection__grid">
    {{ loop control.cards as card }}
    <article class="foundry-showcase-collection__card" {{ loop.attributes }}>
      {{ if card.image }}<img src="{{ card.image }}" alt="{{ card.image.alt }}">{{ endif }}
      <h3>{{ card.title }}</h3>
      <p>{{ card.description }}</p>
      {{ if card.link }}<a href="{{ card.link }}" target="{{ card.link.target }}" {{ card.link.attributes }}>View</a>{{ endif }}
    </article>
    {{ endloop }}
  </div>
</section>

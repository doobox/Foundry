<article class="foundry-showcase {{ part.class }}" {{ part.attributes }}>
    <h2>Bootstrap flexbox and gap</h2>
    <section class="fx-form">
        <h3>Reusable groups</h3>
        <div class="fx-target {{ control.display.classes }} {{ control.flexbox.classes }} {{ control.alignment.classes }} {{ control.gap.classes }}">{{ loop 5 }}<div class="fx-item">Item</div>{{ endloop }}</div>
        <p>Flexbox: {{ control.flexbox.classes }}</p>
        <p>Gap: {{ control.gap.classes }}</p>
    </section>
    <section class="fx-form">
        <h3>Row-first, no reverse</h3>
        <div class="fx-target d-flex {{ control.toolbar.classes }}">{{ loop 8 }}<div class="fx-item">Tool</div>{{ endloop }}</div>
        <p>{{ control.toolbar.classes }}</p>
    </section>
</article>

<section class="foundry-image-slider{{ component.class }}" {{ component.attributes }} data-transition="{{ control.transition }}" data-autoplay="{{ control.autoplay }}" data-interval="{{ control.interval }}" data-pause-on-hover="{{ control.pauseOnHover }}" data-loop="{{ control.loop }}" aria-roledescription="carousel" aria-label="Image slider">
    <div class="foundry-image-slider__viewport">
        <div class="foundry-image-slider__track" aria-live="polite">
            {{ repeat control.slideCount }}
                {{ if !canvas || repeat.position == min(control.canvasSlide, control.slideCount) }}
                    <figure class="foundry-image-slider__slide" data-slide-index="{{ repeat.index }}" aria-roledescription="slide" aria-label="Slide {{ repeat.position }} of {{ repeat.count }}">
                        <div class="foundry-image-slider__media">{{ image }}</div>
                        {{ if control.showCaptions }}<figcaption>{{ text="Image caption" }}</figcaption>{{ endif }}
                    </figure>
                {{ endif }}
            {{ endrepeat }}
        </div>

        {{ if control.showArrows }}
            <button class="foundry-image-slider__arrow foundry-image-slider__arrow--previous" type="button" data-slider-previous aria-label="Previous slide">‹</button>
            <button class="foundry-image-slider__arrow foundry-image-slider__arrow--next" type="button" data-slider-next aria-label="Next slide">›</button>
        {{ endif }}
    </div>

    {{ if control.showDots }}
        <div class="foundry-image-slider__dots" role="group" aria-label="Choose a slide">
            {{ repeat control.slideCount }}
                <button type="button" data-slider-dot="{{ repeat.index }}" aria-label="Show slide {{ repeat.position }}"></button>
            {{ endrepeat }}
        </div>
    {{ endif }}
</section>
